name: Update pinned projects

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch pinned repos in pin order
        run: node scripts/fetch-pinned.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit projects.json if it changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update pinned projects list"
          file_pattern: projects.json
