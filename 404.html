<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الصفحة غير موجودة | علي كامل ياسين</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://lo-oxll.github.io/ali/">
  <link rel="icon" href="favicon.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <style>
    .notfound {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      padding: var(--space-5) 20px;
      gap: var(--space-2);
    }
    .notfound__code {
      font-family: 'Amiri', serif;
      font-weight: 700;
      font-size: 56px;
      line-height: 1;
      background: var(--metal-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .notfound__title { font-size: 19px; font-weight: 700; color: var(--fg-heading); }
    .notfound__text { font-size: 14.5px; color: var(--fg-muted); max-width: 42ch; line-height: 1.8; }
  </style>
</head>

<body>
  <main class="card is-visible">
    <div class="card__band"></div>

    <div class="notfound">
      <div class="notfound__code">404</div>
      <div class="notfound__title">الصفحة غير موجودة</div>
      <p class="notfound__text">الرابط الذي فتحته غير صحيح أو تم نقله. يمكنك العودة إلى الصفحة الرئيسية من الزر أدناه.</p>
      <a class="cta-btn cta-btn--primary" href="https://lo-oxll.github.io/ali/">
        <i class="fa-solid fa-house" aria-hidden="true"></i> العودة إلى الصفحة الرئيسية
      </a>
    </div>

    <div class="card__footer">
      <span>© 2026 Ali Kamil Yaseen. All rights reserved.</span>
    </div>
  </main>
</body>
</html>
